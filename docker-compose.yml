version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: launchpilot_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: launchpilot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - launchpilot_pgdata:/var/lib/postgresql/data

volumes:
  launchpilot_pgdata:
